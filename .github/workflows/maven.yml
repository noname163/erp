name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  test-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Tests with Coverage
        run: mvn clean verify jacoco:report

      - name: Check Coverage
        id: coverage
        run: |
          COVERAGE=$(grep -oPm1 "(?<=<counter type=\"INSTRUCTION\" missed=\"[0-9]+\" covered=\")[0-9]+" target/site/jacoco/jacoco.xml | awk '{sum+=$1} END {print sum}')
          MISSED=$(grep -oPm1 "(?<=<counter type=\"INSTRUCTION\" missed=\")[0-9]+" target/site/jacoco/jacoco.xml | awk '{sum+=$1} END {print sum}')
          TOTAL=$((COVERAGE + MISSED))
          PERCENT=$((100 * COVERAGE / TOTAL))
          echo "Coverage = $PERCENT%"
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT
          if [ $PERCENT -lt 60 ]; then
            echo "Coverage below 60%. Failing."
            exit 1
          fi

      - name: Auto merge PR if coverage >= 60%
        if: success()
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
