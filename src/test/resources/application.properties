spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
security.whitelist=/api/auth/login,/api/auth/register,/api/public/**,/swagger-ui/**,/v3/api-docs/**
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email notification service
email.maxRetry=${EMAIL_MAX_RETRY:3}
email.defaultFrom=${EMAIL_DEFAULT_FROM:${MAIL_USERNAME:}}
email.retry.enabled=${EMAIL_RETRY_ENABLED:false}
email.retry.fixedDelayMs=${EMAIL_RETRY_FIXED_DELAY_MS:60000}