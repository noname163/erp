spring.config.import=optional:file:.env[.properties]
spring.application.name=erp
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.main.allow-bean-definition-overriding=true
security.whitelist=/api/auth/login,/api/auth/register,/api/public/**,/swagger-ui/**,/v3/api-docs/**

# CORS (comma-separated origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email notification service
email.maxRetry=${EMAIL_MAX_RETRY:3}
email.defaultFrom=${EMAIL_DEFAULT_FROM:${MAIL_USERNAME:}}
email.retry.enabled=${EMAIL_RETRY_ENABLED:false}
email.retry.fixedDelayMs=${EMAIL_RETRY_FIXED_DELAY_MS:60000}
